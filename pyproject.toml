[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledda"
version = "0.0.1"
description = "Python SDK for Ledda — prompt management for LLM applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Ledda", email = "support@ledda.ai" }]
keywords = ["llm", "prompts", "prompt-management", "ai", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/ledda-ai/ledda-python"
Documentation = "https://docs.ledda.ai/sdk/python"
Repository = "https://github.com/ledda-ai/ledda-python"
Issues = "https://github.com/ledda-ai/ledda-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ledda"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
